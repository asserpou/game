<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaGuard</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a1a0a;
    }

    /* ─── Unity Canvas ─── */
    #unity-canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      background: #231F20;
      display: block;
    }

    /* ─── Play Overlay ─── */
    #play-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(0, 50, 120, 0.5) 0%, transparent 70%),
        radial-gradient(ellipse at 50% 0%, rgba(37, 172, 255, 0.4) 0%, transparent 60%),
        linear-gradient(180deg, #1a475b 0%, #154c56 60%, #071208 100%);
      transition: opacity 0.7s ease, visibility 0.7s;
    }
    #play-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Animated water waves at bottom */
    .wave-container {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      overflow: hidden;
    }
    .wave {
      position: absolute;
      bottom: 0;
      left: -100%;
      width: 300%;
      height: 80px;
      border-radius: 50% 50% 0 0;
      opacity: 0.15;
      animation: waveMove linear infinite;
    }
    .wave-1 {
      background: #00b4d8;
      animation-duration: 8s;
      bottom: 0;
    }
    .wave-2 {
      background: #0077b6;
      animation-duration: 12s;
      animation-delay: -4s;
      bottom: 10px;
      opacity: 0.1;
    }
    .wave-3 {
      background: #48cae4;
      animation-duration: 6s;
      animation-delay: -2s;
      bottom: 5px;
      opacity: 0.08;
    }
    @keyframes waveMove {
      0%   { transform: translateX(0) scaleY(1); }
      50%  { transform: translateX(25%) scaleY(1.1); }
      100% { transform: translateX(0) scaleY(1); }
    }

    /* Floating particles */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .p {
      position: absolute;
      border-radius: 50%;
      animation: floatUp linear infinite;
      opacity: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(0); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 0.4; }
      100% { transform: translateY(-95vh) scale(1.5); opacity: 0; }
    }

    /* Stars / sparkles */
    .sparkle {
      position: absolute;
      width: 2px; height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* Logo */
    .overlay-logo {
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .logo-text {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      line-height: 1;
    }
    .logo-text .aqua { color: #ffffff; text-shadow: 0 0 20px rgba(255,255,255,0.3), 3px 3px 0 #1a4a1a; }
    .logo-text .guard { color: #00b4d8; text-shadow: 0 0 20px rgba(0,180,216,0.6), 3px 3px 0 #003d55; }


    /* Play button */
    .play-btn-wrap {
      position: relative;
      z-index: 2;
      cursor: pointer;
      outline: none;
      border: none;
      background: none;
    }

    /* Outer glow rings */
    .ring-outer {
      position: absolute;
      inset: -25px;
      border-radius: 50%;
      border: 1px solid rgba(93, 131, 202, 0.2);
      animation: ringExpand 3s ease-out infinite;
    }
    .ring-outer-2 {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(93, 129, 202, 0.3);
      animation: ringExpand 3s ease-out infinite;
      animation-delay: 1s;
    }
    @keyframes ringExpand {
      0%   { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .play-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(100, 160, 220, 0.25), rgba(0, 37, 60, 0.9));
      border: 3px solid #5d90ca;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 6px rgba(93, 137, 202, 0.08),
        0 0 30px rgba(93, 118, 202, 0.4),
        inset 0 0 30px rgba(0,0,0,0.5);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      animation: playPulse 2.5s ease-in-out infinite;
    }
    @keyframes playPulse {
      0%, 100% { box-shadow: 0 0 0 6px rgba(93, 167, 202, 0.08), 0 0 30px rgba(93, 137, 202, 0.4), inset 0 0 30px rgba(0,0,0,0.5); }
      50%       { box-shadow: 0 0 0 12px rgba(93, 142, 202, 0.05), 0 0 55px rgba(93, 153, 202, 0.65), inset 0 0 30px rgba(0,0,0,0.5); }
    }
    .play-btn-wrap:hover .play-circle {
      transform: scale(1.1);
      box-shadow: 0 0 0 10px rgba(93, 113, 202, 0.1), 0 0 70px rgba(93, 153, 202, 0.8), inset 0 0 30px rgba(0,0,0,0.5);
    }
    .play-btn-wrap:active .play-circle {
      transform: scale(0.96);
    }

    .triangle {
      width: 0; height: 0;
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-left: 38px solid #7ddaff;
      margin-left: 10px;
      filter: drop-shadow(0 0 10px rgba(100, 167, 255, 0.9));
    }

    .play-label {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.38rem, 1vw, 0.55rem);
      color: rgba(180, 188, 230, 0.75);
      letter-spacing: 5px;
      position: relative;
      z-index: 2;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ─── Loading overlay ─── */
    #loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(180deg, #071a10 0%, #0d2a14 60%, #071208 100%);
    }
    #loading-overlay.active { display: flex; }

    .loading-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.38rem, 1vw, 0.55rem);
      color: rgba(100,220,120,0.85);
      letter-spacing: 4px;
      animation: blink 1s ease-in-out infinite;
    }
    .bar-outer {
      width: clamp(200px, 40vw, 320px);
      height: 20px;
      border: 2px solid #5db6ca;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(0,0,0,0.5);
    }
    .bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00b4d8, #b9d4ff);
      border-radius: 10px;
      transition: width 0.25s ease;
      box-shadow: 0 0 12px rgba(93, 166, 202, 0.6);
    }
    .bar-percent {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.32rem, 0.8vw, 0.45rem);
      color: rgba(100,200,100,0.6);
      letter-spacing: 2px;
    }

    /* ─── Unity warning ─── */
    #unity-warning {
      position: absolute;
      left: 50%; top: 5%;
      transform: translateX(-50%);
      background: white;
      padding: 10px;
      display: none;
      z-index: 50;
      border-radius: 6px;
      max-width: 80%;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Unity renders here -->
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <!-- Unity warning banner -->
  <div id="unity-warning"></div>

  <!-- ── PLAY OVERLAY ── -->
  <div id="play-overlay">

    <!-- Animated waves -->
    <div class="wave-container">
      <div class="wave wave-1"></div>
      <div class="wave wave-2"></div>
      <div class="wave wave-3"></div>
    </div>

    <!-- Particles & sparkles injected by JS -->
    <div class="particles" id="particles"></div>

    <!-- Logo -->
    <div class="overlay-logo">
      <div class="logo-text">
        <span class="aqua">AQUA</span><span class="guard">GUARD</span>
        <br>
        <br>
      </div>


    <!-- Play button -->
    <button class="play-btn-wrap" id="play-btn" onclick="startGame()">
      <div class="ring-outer"></div>
      <div class="ring-outer-2"></div>
      <div class="play-circle">
        <div class="triangle"></div>
      </div>
    </button>
<br><br><br>
    <div class="play-label">PRESS TO PLAY</div>

  </div>

  <!-- ── LOADING OVERLAY ── -->
  <div id="loading-overlay">
    <div class="loading-title">LOADING...</div>
    <div class="bar-outer">
      <div class="bar-inner" id="bar-inner"></div>
    </div>
    <div class="bar-percent" id="bar-percent">0%</div>
  </div>

  <!-- Fullscreen button -->

  <script>
    // ── Spawn particles ──
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'p';
      const size = 4 + Math.random() * 7;
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        bottom: ${Math.random() * 20}%;
        width: ${size}px;
        height: ${size}px;
        background: hsla(${130 + Math.random() * 80}, 75%, 55%, 0.7);
        animation-duration: ${5 + Math.random() * 8}s;
        animation-delay: ${Math.random() * 8}s;
      `;
      particlesEl.appendChild(p);
    }
    // sparkles
    for (let i = 0; i < 35; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.cssText = `
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 70}%;
        animation-duration: ${1.5 + Math.random() * 3}s;
        animation-delay: ${Math.random() * 4}s;
      `;
      particlesEl.appendChild(s);
    }

    // ── Unity loader ──
    var unityInstance = null;
    var gameStarted   = false;

    function startGame() {
      if (gameStarted) return;
      gameStarted = true;

      // Fade out play overlay
      document.getElementById('play-overlay').classList.add('hidden');

      // Show loading overlay
      document.getElementById('loading-overlay').classList.add('active');

      var buildUrl    = "Build";
      var loaderUrl   = buildUrl + "/half of the game.loader.js";

      var config = {
        arguments:          [],
        dataUrl:            buildUrl + "/half of the game.data.unityweb",
        frameworkUrl:       buildUrl + "/half of the game.framework.js.unityweb",
        codeUrl:            buildUrl + "/half of the game.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "DefaultCompany",
        productName:        "Aqua Guard",
        productVersion:     "1.0",
        showBanner:         unityShowBanner,
      };

      var canvas = document.getElementById('unity-canvas');

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name    = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.head.appendChild(meta);
      }

      var script  = document.createElement("script");
      script.src  = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          const pct = Math.round(progress * 100);
          document.getElementById('bar-inner').style.width   = pct + '%';
          document.getElementById('bar-percent').textContent = pct + '%';
        })
        .then((instance) => {
          unityInstance = instance;
          document.getElementById('loading-overlay').classList.remove('active');
        })
        .catch((msg) => alert(msg));
      };
      document.body.appendChild(script);
    }

    function unityShowBanner(msg, type) {
      var banner = document.getElementById("unity-warning");
      function update() { banner.style.display = banner.children.length ? 'block' : 'none'; }
      var div = document.createElement('div');
      div.innerHTML = msg;
      banner.appendChild(div);
      if (type === 'error') {
        div.style = 'background:red;padding:10px;';
      } else {
        if (type === 'warning') div.style = 'background:yellow;padding:10px;';
        setTimeout(() => { banner.removeChild(div); update(); }, 5000);
      }
      update();
    }
  </script>
</body>
</html>
